[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --flash-size 16mb --partition-table partitions.csv --baud 2000000 --monitor"
rustflags = ["--cfg", "espidf_time64"]
[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU="esp32s3"
# Note: this variable is not used by the pio builder (`cargo build --features pio`)
ESP_IDF_VERSION = "v5.3.3"
ESP_IDF_TOOLS_INSTALL_DIR = { value = "global" } # add this line

WIFI_SSID= "MowMaster"
WIFI_PASSWORD = "12345678"
OTA_SERVER_URL = "http://ota.turfterminator.smolander.dev"
PROXY_USER = "santeri@smolander.dev"
PROXY_PASSWORD = "asdasd"

[toolchain]
channel = "nightly"
